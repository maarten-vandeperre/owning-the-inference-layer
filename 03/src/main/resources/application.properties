quarkus.http.host=127.0.0.1
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=8K
coffee.provider=${AI_PROVIDER:OpenShift AI MaaS}
coffee.chat-url=${AI_CHAT_URL:https://maas.example.invalid/llm/your-model/v1/chat/completions}
coffee.model=${AI_MODEL:replace-with-served-model-id}
coffee.api-key=${AI_API_KEY:}
coffee.auth-required=true
coffee.json-mode=${AI_JSON_MODE:false}
coffee.timeout-seconds=${AI_TIMEOUT_SECONDS:90}
quarkus.log.category."be.devoxx.coffee".level=INFO

# Explicit local container hosts; never a blanket HTTP bypass.
coffee.http-allowed-hosts=${AI_HTTP_ALLOWED_HOSTS:}

# Quarkus LangChain4j (OpenAI-compatible; base-url derived from coffee.chat-url)
quarkus.langchain4j.openai.api-key=${coffee.api-key:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=${coffee.model}
quarkus.langchain4j.openai.timeout=${coffee.timeout-seconds}s
quarkus.langchain4j.openai.chat-model.temperature=0
# Small MaaS/local models (e.g. a 1024-token context qwen3-06b) reject a response budget
# that leaves no room for the prompt; keep this modest and let AI_MAX_TOKENS override it.
quarkus.langchain4j.openai.chat-model.max-tokens=${AI_MAX_TOKENS:500}
quarkus.langchain4j.openai.max-retries=1
