apiVersion: v1
kind: Namespace
metadata:
  name: maas-models
  labels:
    # Required: lets the maas-default-gateway accept HTTPRoutes from this namespace
    maas.opendatahub.io/gateway-access: "true"
    # Shows the namespace as a Data Science Project in the RHOAI dashboard
    opendatahub.io/dashboard: "true"
    opendatahub.io/generated-namespace: "true"
