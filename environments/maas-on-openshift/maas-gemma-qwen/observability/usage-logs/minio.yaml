apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/rh-aiservices-bu/minio:RELEASE.2025-09-07T16-13-09Z
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-secret, key: access_key_id}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-secret, key: access_key_secret}
          ports:
            - containerPort: 9000
              name: api
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/rh-aiservices-bu/mc:latest
          env:
            - name: HOME
              value: /tmp
            - name: AK
              valueFrom:
                secretKeyRef: {name: minio-secret, key: access_key_id}
            - name: SK
              valueFrom:
                secretKeyRef: {name: minio-secret, key: access_key_secret}
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$AK" "$SK"; do sleep 5; done
              mc mb local/loki --ignore-existing
          resources:
            requests: {cpu: 50m, memory: 64Mi}
