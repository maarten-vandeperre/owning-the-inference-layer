apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: usage
spec:
  managementState: Managed
  size: 1x.demo
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
            - name: service.name
            - name: subscription
            - name: model
            - name: response_type
            - name: kubernetes_namespace_name
  storage:
    schemas:
      - effectiveDate: "2024-10-01"
        version: v13
    secret:
      credentialMode: static
      name: minio-secret
      type: s3
  storageClassName: REPLACED-BY-KUSTOMIZE
  tenants:
    mode: openshift-logging
