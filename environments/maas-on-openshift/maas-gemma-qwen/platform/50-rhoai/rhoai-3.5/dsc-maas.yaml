# RHOAI 3.5+: MaaS moved to the aigateway component
# (kserve.modelsAsService is frozen/deprecated in 3.5, do not set it here)
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    kserve:
      managementState: Managed
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
