# Partial DataScienceCluster / OdhDashboardConfig objects, applied with server-side apply.
# Only the MaaS, Gen AI studio/playground and observability fields are owned here;
# everything else in your DSC is untouched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
  argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
resources:
  - dsc-maas.yaml
  - dashboard-maas.yaml
