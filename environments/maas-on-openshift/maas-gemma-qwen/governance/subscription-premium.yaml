apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: small-models-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Small models: Premium"
    openshift.io/description: "100k tokens/min per model for maas-premium-users"
spec:
  owner:
    groups:
      - name: maas-premium-users
    users: []
  modelRefs:
    - name: gemma-3-270m-it
      namespace: maas-models
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: qwen3-0-6b
      namespace: maas-models
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 20
