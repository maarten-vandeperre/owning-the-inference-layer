apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: small-models-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Small models access"
    openshift.io/description: "All authenticated users may call Gemma 3 270M and Qwen3 0.6B"
spec:
  modelRefs:
    - name: gemma-3-270m-it
      namespace: maas-models
    - name: qwen3-0-6b
      namespace: maas-models
  subjects:
    groups:
      - name: system:authenticated
    users: []
